services:
  al-muttaqin-api:
    container_name: al-muttaqin-api
    build:
      context: ./server
      dockerfile: Dockerfile
    image: al-muttaqin-api:latest
    restart: unless-stopped
    volumes:
      - ./data:/app/data
    environment:
      - PORT=4000
      - DB_PATH=/app/data/mushola.db
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID:?isi GOOGLE_CLIENT_ID di .env}
      - JWT_SECRET=${JWT_SECRET:?isi JWT_SECRET di .env}
    networks:
      - internal_net

  al-muttaqin-app:
    container_name: al-muttaqin-app
    build:
      context: .
      dockerfile: Dockerfile
    image: al-muttaqin-app:latest
    restart: unless-stopped
    depends_on:
      - al-muttaqin-api
    networks:
      - internal_net
      - proxy
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=proxy"
      - "traefik.http.routers.al-muttaqin.rule=Host(`al-muttaqin.natsuko.ai.id`)"
      - "traefik.http.routers.al-muttaqin.entrypoints=websecure"
      - "traefik.http.routers.al-muttaqin.tls.certresolver=myresolver"
      - "traefik.http.services.al-muttaqin.loadbalancer.server.port=80"

networks:
  internal_net:
    driver: bridge
  proxy:
    external: true
